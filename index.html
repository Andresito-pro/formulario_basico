<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Iniciar sesión</h1>
        <form action="" class="formulario">
            <label for="name">Nombre</label>
            <input class="entrada" type="text" id="name" name="name" placeholder="Nombre">
            <br>
            <label for="lastname">Apellido</label>
            <input class="entrada" type="text" id="lastname" name="lastname" placeholder="Apellido">
            <br>
            <label for="tipo-documento">Tipo de documento</label>
            <select class="entrada" id="tipo-documento" name="tipo-documento">
                <option value="" disabled selected>Seleccione un tipo...</option>
                <option value="CC">Cédula de Ciudadanía (CC)</option>
                <option value="TI">Tarjeta de Identidad (TI)</option>
                <option value="CE">Cédula de Extranjería (CE)</option>
                <option value="Pasaporte">Pasaporte</option>
            </select>
            <br>
            <label for="DNI">Número de documento (DNI)</label>
            <input class="entrada" type="text" id="DNI" name="DNI" placeholder="Número de documento">
            <br>
            <label for="fecha-nacimiento">Fecha de nacimiento</label>
            <input class="entrada" type="date" id="fecha-nacimiento" name="fecha-nacimiento">
            <br>
            <label for="numero-telefono">Número de teléfono</label>
            <input class="entrada" type="text" id="numero-telefono" name="numero-telefono"
                placeholder="Número de teléfono">
            <br>
            <label for="email">Email</label>
            <input class="entrada" type="email" id="email" name="email" placeholder="Email">
            <br>
            <label for="pais-domicilio">País de domicilio</label>
            <select class="entrada" id="pais-domicilio" name="pais-domicilio">
                <option value="" disabled selected>Seleccione un país...</option>
                <option value="Colombia">Colombia</option>
                <option value="Argentina">Argentina</option>
                <option value="Mexico">México</option>
                <option value="Espana">España</option>
                <option value="Otro">Otro...</option>
            </select>
            <br>
            <label for="ciudad-domicilio">Ciudad de domicilio</label>
            <select class="entrada" id="ciudad-domicilio" name="ciudad-domicilio">
                <option value="" disabled selected>Seleccione una ciudad...</option>
                <option value="Bogota">Bogotá</option>
                <option value="Medellin">Medellín</option>
                <option value="Cali">Cali</option>
                <option value="Barranquilla">Barranquilla</option>
                <option value="Otra">Otra...</option>
            </select>
            <br>
            <div class="checkbox-group">
                <label for="terminos" class="label">Acepto los términos y condiciones</label>
                <input type="checkbox" id="terminos" name="terminos" class="checkbox-input">
            </div>
            <br>
            <button type="submit" class="btn-submit">Registrarse</button>
        </form>
    </div>
</body>

</html>
