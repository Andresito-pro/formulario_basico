<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Iniciar sesión</h1>
        <form action="" class="formulario">
            <label for="name">Nombre</label>
            <input class="entrada" type="text" id="name" name="name" placeholder="Nombre">
            <br>
            <label for="lastname">Apellido</label>
            <input class="entrada" type="text" id="lastname" name="lastname" placeholder="Apellido">
            <br>
            <label for="tipo-documento">Tipo de documento</label>
            <input class="entrada" type="text" id="tipo-documento" name="tipo-documento"
                placeholder="Tipo de documento">
            <br>
            <label for="DNI">DNI</label>
            <input class="entrada" type="text" id="DNI" name="DNI" placeholder="DNI">
            <br>
            <label for="fecha-nacimiento">Fecha de nacimiento</label>
            <input class="entrada" type="date" id="fecha-nacimiento" name="fecha-nacimiento"
                placeholder="Fecha de nacimiento">
            <br>
            <label for="numero-telefono">Número de teléfono</label>
            <input class="entrada" type="text" id="numero-telefono" name="numero-telefono"
                placeholder="Número de teléfono">
            <br>
            <label for="email">Email</label>
            <input class="entrada" type="email" id="email" name="email" placeholder="Email"
                placeholder="[EMAIL_ADDRESS]">
            <br>
            <label for="pais-domicilio">País de domicilio</label>
            <input class="entrada" type="text" id="pais-domicilio" name="pais-domicilio"
                placeholder="País de domicilio">
            <br>
            <label for="ciudad-domicilio">Ciudad de domicilio</label>
            <input class="entrada" type="text" id="ciudad-domicilio" name="ciudad-domicilio"
                placeholder="Ciudad de domicilio">
            <br>
            <div class="checkbox-group">
                <label for="terminos" class="label">Acepto los términos y condiciones</label>
                <input type="checkbox" id="terminos" name="terminos" class="checkbox-input">
            </div>
            <br>
            <button type="submit" class="btn-submit">Registrarse</button>
        </form>
    </div>
</body>

</html>
